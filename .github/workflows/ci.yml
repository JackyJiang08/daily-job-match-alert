name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Syntax check
        run: |
          for file in src/*.mjs src/collectors/*.mjs; do
            node --check "$file"
          done
      - name: Build and verify XLSX smoke report
        run: |
          output="$RUNNER_TEMP/xlsx-smoke.xlsx"
          node src/report-xlsx.mjs tests/fixtures/xlsx-smoke.json "$output" --verify
          test -s "$output"
