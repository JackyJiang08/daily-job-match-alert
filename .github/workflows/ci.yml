name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # Every combination reports on its own; one failure does not cancel the rest.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Syntax check
        run: |
          for file in src/*.mjs src/collectors/*.mjs src/hub/*.mjs src/engines/*.mjs src/cover-letter/*.mjs; do
            node --check "$file"
          done
      - name: Build and verify XLSX smoke report
        run: |
          output="$RUNNER_TEMP/xlsx-smoke.xlsx"
          node src/report-xlsx.mjs tests/fixtures/xlsx-smoke.json "$output" --verify
          test -s "$output"
      - name: Chaos check (offline, LLM down, malformed input)
        run: npm run chaos
